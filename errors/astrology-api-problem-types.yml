description: >-
  AstrologyAPI publishes no error reference page and no error-code registry. The catalogue below is
  built from error envelopes observed on live requests plus the handling guidance in the provider's
  production checklist. Absent an error reference, this is the whole of what a consumer can know
  about failure modes before their first outage.
format: proprietary
rfc9457: false
content_type: application/json
envelopes:
  - name: auth-failure
    status: 401
    hosts: [json.astrologyapi.com, pdf.astrologyapi.com]
    schema:
      status: boolean
      msg: string
    example: '{"status": false, "msg": "API authentication failed!"}'
    observed: '2026-09-07'
    observed_at: https://json.astrologyapi.com/v1/openapi.json
  - name: unknown-endpoint
    status: 404
