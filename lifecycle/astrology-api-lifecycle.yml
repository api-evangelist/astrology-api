description: >-
  Versioning, availability and change-management posture for AstrologyAPI. The provider runs a
  first-party status page and a dated change log. It publishes no deprecation policy, no sunset
  commitment and no RFC 8594 headers, so a consumer has no published notice period for a withdrawal.
versioning:
  style: URI path
  current: v1
  history:
    - version: v1
      status: current
      note: The only major version ever published. In production since 2013 per the provider's own About page.
  unversioned_surfaces:
    - host: vision.astrologyapi.com
      products: [Palmistry, Face Reading]
      note: >-
        The image products sit outside the /v1 path convention entirely. Their operations are served
        at /palmistry/* and /face-reading/* with no version segment, so a future breaking change to
        them has no version boundary to move behind.
