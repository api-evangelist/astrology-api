components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication. Username is your AstrologyAPI User ID, password is your
        API key. Used with form-encoded request bodies on subscription endpoints.
    accessToken:
      type: apiKey
      in: header
      name: x-astrologyapi-key
      description: Wallet Access Token sent in the x-astrologyapi-key header, used with JSON request bodies
        on wallet-billed and Chat endpoints.
  schemas:
    Error:
      type: object
      properties:
        status:
          type: boolean
        msg:
          type: string
    NotFound:
      type: object
      properties:
        status:
          type: boolean
        statusCode:
          type: integer
        error_msg:
          type: string
