  /acg/travel:
    post:
      operationId: acg_travel
      summary: Travel (Plot Coordinates)
      tags:
      - Astrocartography
      description: 'Returns all of a chart''s astrocartography line coordinates so you can draw a full
        ACG map.


        **What it does** — For each planet it computes where on Earth that planet is exactly on one of
        the four angles — the MC/IC meridians (the longitudes where the planet is overhead or underfoot)
        and the AC/DC curves (the winding lines where it''s rising or setting). Plotting these lines shows
        which places amplify each planet''s themes for the person. Use it to render an interactive relocation/astrocartography
        map.


        **Send** — Standard `birth_details` (see the collection overview), all nine required. `include_parans`
        (boolean, default `false`) — set `true` to also return the latitude-crossing paran lines. Longitudes
        are reported east-positive.


        **Returns** — A JSON object with `meta` and a `lines` array, one entry per planet. Each entry
        holds that planet''s four angle lines: the `asc`/`dsc` are `curve` objects with a `points` array
        of `{latitude_deg, longitude_deg}` samples (stepped by latitude) tracing the rising/setting curve,
        while the MC/IC come back as `meridian` objects carrying a single `longitude_deg`. When `include_parans=true`,
        paran latitude crossings are included in the response.


        **Errors** — Invalid, missing, or out-of-range input returns `400` with the offending field in
        `field_errors`; see the collection overview for the full error format.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
                hour:
                  type: integer
                min:
                  type: integer
                second:
                  type: integer
                tzone:
                  type: number
                lat:
                  type: number
                lon:
                  type: number
                include_parans:
                  type: boolean
              required:
              - day
              - month
              - year
              - hour
              - min
              - second
              - tzone
              - lat
              - lon
              - include_parans
            example:
              day: 22
              month: 8
              year: 1999
              hour: 18
              min: 50
              second: 0
              tzone: 5.5
              lat: 19.0759837
              lon: 72.8776559
              include_parans: false
      responses:
