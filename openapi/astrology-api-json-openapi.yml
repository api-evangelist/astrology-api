  /acg/planetary-line/{category}/{planet}:
    post:
      operationId: acg_planetary_line_category_planet
      summary: Planetary Line Report
      tags:
      - Astrocartography
      description: 'Returns the geometry of one single planet-and-angle astrocartography line.


        **What it does** — Computes just one line: a specific planet on a specific angle (its Midheaven,
        IC, Ascendant, or Descendant line). Use it when you want the coordinates of one line in isolation
        rather than a whole map.


        **Send** — Standard `birth_details` (see the collection overview), all nine required. Path parameter
        `category` — the line/angle type: `MC`, `IC`, `AC`, or `DC`. Path parameter `planet` — the body,
        `SUN` through `PLUTO`.


        **Returns** — A JSON object with `meta` (engine info, the latitude step, the east-positive longitude
        convention, and the reference location) and a `line` object. For MC/IC the line is a `meridian`
        with a single `longitude_deg`, the `object` (planet) name, and the `zenith_latitude_deg` where
        the planet is directly overhead. For AC/DC it comes back as a `curve` with a `points` array of
        `{latitude_deg, longitude_deg}` samples tracing the rising/setting line.


        **Errors** — A bad `category`/`planet` or invalid `birth_details` returns `400` with the offending
        field in `field_errors`; see the collection overview for the full error format.'
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
        example: MC
        description: 'Angle type: MC, IC, AC, or DC'
      - name: planet
        in: path
        required: true
        schema:
          type: string
        example: MOON
        description: 'Planet: SUN through PLUTO'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
                hour:
                  type: integer
                min:
                  type: integer
                second:
                  type: integer
                tzone:
                  type: number
                lat:
                  type: number
                lon:
                  type: number
                include_parans:
                  type: boolean
              required:
              - day
              - month
              - year
              - hour
              - min
              - second
              - tzone
              - lat
              - lon
              - include_parans
            example:
              day: 22
              month: 8
              year: 1999
              hour: 18
              min: 50
              second: 0
              tzone: 5.5
              lat: 19.0759837
              lon: 72.8776559
              include_parans: false
      responses:
        '200':
          description: Computed result. The provider does not publish a response schema for this operation;
