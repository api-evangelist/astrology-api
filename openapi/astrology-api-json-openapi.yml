paths:
  /acg/location/{category}:
    post:
      operationId: acg_location_category
      summary: Category Based Location
      tags:
      - Astrocartography
      description: 'Returns only the astrocartography lines for the planets tied to a chosen life category.


        **What it does** — Maps a life theme (love, career, money, etc.) to its associated planets and
        returns just those planets'' angle lines, so you can highlight the places on Earth that favor
        that area of life rather than drawing the whole map. Use it for themed "best places for love/career"
        map views.


        **Send** — Standard `birth_details` (see the collection overview), all nine required. Path parameter
        `category` — the life area to filter by, e.g. `LOVE`, `CAREER`, `MONEY`, `HEALTH`, `SPIRITUALITY`,
        `ADVENTURE`, `CREATIVITY`, `POWER`, `COMMUNICATION`.


        **Returns** — A JSON object with `meta`, the echoed `category`, and a `lines` array structured
        exactly like the Travel endpoint but limited to the category''s planets: each entry carries that
        planet''s `asc`/`dsc` rising/setting curves (a `points` list of `{latitude_deg, longitude_deg}`)
        and MC/IC meridian longitudes. Longitudes are east-positive.


        **Errors** — An unknown `category` or invalid/missing `birth_details` returns `400` with the offending
        field in `field_errors`; see the collection overview for the full error format.'
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
        example: LOVE
        description: 'Life category: LOVE, CAREER, MONEY, HEALTH, SPIRITUALITY, ADVENTURE, CREATIVITY,
          POWER, COMMUNICATION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
                hour:
                  type: integer
                min:
                  type: integer
                second:
                  type: integer
                tzone:
                  type: number
                lat:
                  type: number
                lon:
                  type: number
                include_parans:
                  type: boolean
              required:
              - day
              - month
              - year
              - hour
              - min
              - second
              - tzone
              - lat
              - lon
              - include_parans
            example:
              day: 22
              month: 8
              year: 1999
              hour: 18
              min: 50
              second: 0
              tzone: 5.5
              lat: 19.0759837
              lon: 72.8776559
              include_parans: false
      responses:
        '200':
          description: Computed result. The provider does not publish a response schema for this operation;
