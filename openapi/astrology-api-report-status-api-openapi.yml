openapi: 3.2.0
info:
  title: Palmistry Service Report Status API
  description: API for Palmistry Service - AI Power Palm Reading
  version: 1.0.0
tags:
- name: Report Status
paths:
  /palmistry/report-status:
    post:
      tags:
      - Report Status
      summary: Get Report Status Endpoint
      operationId: get_report_status_endpoint_palmistry_report_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportStatusRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ReportStatusRequest:
      properties:
        request_id:
          type: string
          maxLength: 64
          title: Request Id
      type: object
      required:
      - request_id
      title: ReportStatusRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
