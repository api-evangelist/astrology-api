openapi: 3.2.0
info:
  title: Palmistry Service Compatibility Report API
  description: API for Palmistry Service - AI Power Palm Reading
  version: 1.0.0
tags:
- name: Compatibility Report
paths:
  /palmistry/compatibility-report:
    post:
      tags:
      - Compatibility Report
      summary: Get Compatibility Report Endpoint
      description: 'The couple''s compatibility report as a PDF, built in the background.


        Replies at once with {"status": true, "message", "request_id", "compatibility_id"};

        the PDF link comes from /palmistry/report-status (and the optional webhook_url).

        Input errors (400 / 404 / 422) are still returned immediately.'
      operationId: get_compatibility_report_endpoint_palmistry_compatibility_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompatibilityReportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CompatibilityReportRequest:
      properties:
        compatibility_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Compatibility Id
        partner_1_palm_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Partner 1 Palm Id
        partner_2_palm_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Partner 2 Palm Id
        partner_1_name:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          title: Partner 1 Name
        partner_2_name:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          title: Partner 2 Name
        webhook_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Webhook Url
      type: object
      title: CompatibilityReportRequest
