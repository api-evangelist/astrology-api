openapi: 3.2.0
info:
  title: Palmistry Service Palm Report API
  description: API for Palmistry Service - AI Power Palm Reading
  version: 1.0.0
tags:
- name: Palm Report
paths:
  /palmistry/palm-report:
    post:
      tags:
      - Palm Report
      summary: Get Palm Report Endpoint
      description: 'Full palm report as a PDF, built in the background.


        Replies at once with {"status": true, "message", "request_id"}; the PDF link comes

        from /palmistry/report-status (and the optional webhook_url). Input errors

        (400 webhook_url, 404 palm_id, 422 name) are still returned immediately.'
      operationId: get_palm_report_endpoint_palmistry_palm_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PalmReportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PalmReportRequest:
      properties:
        palm_id:
          type: string
          title: Palm Id
        name:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          title: Name
        webhook_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Webhook Url
      type: object
      required:
      - palm_id
      title: PalmReportRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
