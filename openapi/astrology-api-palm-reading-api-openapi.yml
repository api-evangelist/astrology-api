components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PalmIDRequest:
      properties:
        palm_id:
          type: string
          title: Palm Id
      type: object
      required:
      - palm_id
      title: PalmIDRequest
    PalmReadingRequest:
      properties:
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        img_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Img Url
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
        day:
          anyOf:
          - type: integer
          - type: 'null'
          title: Day
        month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Month
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
      type: object
      title: PalmReadingRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
