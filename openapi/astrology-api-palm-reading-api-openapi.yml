openapi: 3.2.0
info:
  title: Palmistry Service Palm Reading API
  description: API for Palmistry Service - AI Power Palm Reading
  version: 1.0.0
tags:
- name: Palm Reading
paths:
  /palmistry/basic:
    post:
      tags:
      - Palm Reading
      summary: Palm Scanner Basic
      description: 'Generates a basic palm reading report from an image URL.


        Args:

        data (PalmReadingRequest): The request body containing ''image_url'' or ''url''.

        service: The palm reading service dependency.


        Returns:

        dict: The basic palm reading result.'
      operationId: palm_scanner_basic_palmistry_basic_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PalmReadingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /palmistry/get-palm-id:
    post:
      tags:
      - Palm Reading
      summary: Palm Scanner
      description: 'Generates a professional palm reading report and saves it to the database.


        Args:

        data (PalmReadingRequest): The request body containing ''image_url'' or ''url''.

        service: The palm reading service dependency.


        Returns:

        dict: The pro palm reading result including the database reading ID.'
      operationId: palm_scanner_palmistry_get_palm_id_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PalmReadingRequest'
