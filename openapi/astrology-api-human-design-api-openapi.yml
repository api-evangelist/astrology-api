paths:
  /human-design:
    post:
      operationId: human_design
      summary: POST /v1/human-design
      tags:
      - Human Design
      description: Builds a person's core Human Design bodygraph from birth details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                gender:
                  type: string
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
                hour:
                  type: integer
                min:
                  type: integer
                lat:
                  type: number
                lon:
                  type: number
                tzone:
                  type: integer
              required:
              - name
              - gender
              - day
              - month
              - year
              - hour
              - min
              - lat
              - lon
              - tzone
            example:
              name: Ajeet
              gender: male
              day: 15
              month: 8
              year: 1990
              hour: 10
              min: 30
              lat: 39.9526
              lon: -75.1652
              tzone: -5
      responses:
        '200':
          description: Computed result. The provider does not publish a response schema for this operation; see the endpoint reference for the returned fields.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication failed — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: false
                msg: API authentication failed!
        '404':
          description: The requested API endpoint is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              example:
                status: false
                statusCode: 404
                error_msg: The requested API endpoint is not available. Kindly check your api name/url or HTTP method type.
      externalDocs:
        description: Human Design documentation
        url: https://astrologyapi.com/products/human-design-api
      x-postman-collection: Human Design APIs Collection
