- aid: astrology-api:astrology-api-palmistry
  name: AstrologyAPI Palmistry API
  description: Image-based palm reading. Submit a palm photograph as a public URL or base64 data URL (jpeg,
    jpg, png or webp, up to 5MB) together with a date of birth and gender to obtain a palm_id, then read
    structured hand type, finger, mount, major and minor line and special-feature analysis, per-aspect
    readings covering personality, career, money, love, marriage, health, challenges and luck, and a processed
    overlay image. This is the only AstrologyAPI surface with a first-party OpenAPI published by the provider.
  humanURL: https://astrologyapi.com/developers/v1/palm-reading-api
