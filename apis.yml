aid: astrology-api
name: Astrology API
description: AstrologyAPI (astrologyapi.com) is a developer-first astrology calculation platform, in production
  since 2013, providing 300+ REST endpoints across Vedic (Jyotish) and Western traditions under a single
  API key. Coverage includes Kundli and divisional charts, Vimshottari and Yogini dashas, KP sub-lords,
  Lal Kitab, Varshaphal, Shadbala and Bhavabala strength scoring, panchang and muhurta, Ashtakoot and
  Dashakoot matchmaking, natal, synastry, composite and solar-return charts, transits, AstroCartoGraphy,
  Human Design, numerology, tarot, palmistry and face reading, plus multi-language horoscope content feeds
  and white-labeled PDF report generation. The platform also runs a hosted MCP server exposing its calculation
  tools to LLM agents, and a chart-grounded AI chat product. Billing is a pay-as-you-go credit wallet
  in INR with optional suite subscriptions.
