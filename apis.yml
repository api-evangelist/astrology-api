apis:
- aid: astrology-api:astrology-api
  name: Astrology API
  description: The AstrologyAPI JSON API — 158 documented operations covering Vedic (Jyotish) and Western
    astrology, Human Design and AstroCartoGraphy. Includes birth details, planetary positions, divisional
    and KP charts, Vimshottari/Yogini/Char dashas, Shadbala and Bhavabala strength scoring, panchang and
    muhurta, dosha analysis, Ashtakoot and Dashakoot matchmaking, tropical natal charts, house cusps,
    aspects, synastry and composite charts, transits, numerology and sun-sign horoscope content feeds.
    All operations are POST; authentication is HTTP Basic (User ID + API key) or a wallet access token
    in an x-astrologyapi-key header.
