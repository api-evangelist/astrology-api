- aid: astrology-api:astrology-api-face-reading
  name: AstrologyAPI Face Reading API
  description: Image-based face reading. Submit a face photograph with date of birth and gender to obtain
    a face_id, then read structured analysis of face shape, eyes, nose, cheeks and cheekbones, mouth,
