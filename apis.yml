- aid: astrology-api:astrology-api-mcp
  name: AstrologyAPI MCP Server
  description: First-party hosted Model Context Protocol server exposing AstrologyAPI's calculation engine
    to LLM agents and IDEs. The provider advertises 109 tools spanning Vedic and Western astrology, configured
    with a wallet access token in an x-astrologyapi-key header. The server also advertises OAuth with
    RFC 8414 and RFC 9728 discovery documents. tools/list is authentication-gated.
