cross_cutting_rules:
  authentication: >-
    HTTP Basic (User ID + API key) with form-encoded bodies, or an x-astrologyapi-key access token
    with JSON bodies. Server-side only — no CORS headers are sent.
  retries: Retry on 5xx and network errors with exponential backoff; never retry a 4xx.
  idempotency: >-
    None. No idempotency key exists on any operation, so a retry after a timeout re-bills. This
    matters most on the PDF operations, which mint a billed, non-refundable artifact.
  rate_limits: None published, and no rate-limit response headers. Consumption is bounded by wallet credits.
  caching: >-
    Cache on the birth tuple (day, month, year, hour, min, lat, lon, tzone) plus ayanamsha or
    house_type. Natal results never change; daily content changes once a day and is shared by all users.
